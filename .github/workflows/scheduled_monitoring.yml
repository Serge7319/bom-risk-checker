name: Scheduled BOM Monitoring

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  run-monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
      - name: Create Streamlit Secrets File
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml <<EOF
          SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"
          SUPABASE_KEY = "${{ secrets.SUPABASE_KEY }}"
          RESEND_API_KEY = "${{ secrets.RESEND_API_KEY }}"
          ALERT_FROM_EMAIL = "${{ secrets.ALERT_FROM_EMAIL }}"
          MOUSER_API_KEY = "${{ secrets.MOUSER_API_KEY }}"
          DIGIKEY_CLIENT_ID = "${{ secrets.DIGIKEY_CLIENT_ID }}"
          DIGIKEY_CLIENT_SECRET = "${{ secrets.DIGIKEY_CLIENT_SECRET }}"
          EOF

      - name: Run Monitoring Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
        run: |
          python src/run_scheduled_monitoring.py
        