[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[client]
showSidebarNavigation = false
toolbarMode = "minimal"

[server]
headless = true
address = "0.0.0.0"
# Railway terminates TLS before Streamlit. Explicitly preserve the public
# origin so Streamlit's XSRF-protected upload endpoint accepts browser uploads
# from app.cadivor.com without weakening XSRF protection.
enableCORS = true
corsAllowedOrigins = ["https://app.cadivor.com"]
enableXsrfProtection = true
xsrfCookieSameSite = "lax"
maxUploadSize = 200
maxMessageSize = 200

[browser]
serverAddress = "app.cadivor.com"
serverPort = 443
gatherUsageStats = false
