<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>html,body{margin:0;padding:0;width:1px;height:1px;overflow:hidden}</style>
</head>
<body>
<script>
(() => {
  /**
   * Cadivor browser Back/Forward bridge.
   *
   * Streamlit's built-in popstate handler only reacts to multipage pathname
   * changes — query-only history hops never rerun the script. This component
   * emits one setComponentValue when the address bar changes so Python can
   * restore the route without writing query params again.
   *
   * The listener is installed on the parent window and survives iframe remounts.
   * The iframe only drains a pending event into Streamlit.
   */
  let ready = false;
  let lastEmittedId = "";

  function post(type, extra = {}) {
    window.parent.postMessage({isStreamlitMessage: true, type, ...extra}, "*");
  }

  function host() {
    return window.parent;
  }

  // Bump when cover/rail settle logic changes so long-lived parent tabs
  // replace the previous click/observer handlers instead of keeping Nov-3
  // mid-viewport release behavior after a deploy.
  // v5: skeleton surface + canonical route labels (Nov 3 blank-canvas recording).
  const IMMEDIATE_NAV_COVER_VERSION = "nov3-548-skeleton-v5";

  // Menu aliases → canonical Streamlit route names used in ?page= and body markers.
  const CANONICAL_ROUTE_BY_LABEL = {
    "Home": "Dashboard",
    "BOM Analyzer": "BOM Analyzer",
    "Engineering Decisions": "Engineering Decisions",
    "Monitoring": "Monitoring",
    "Find a replacement": "Alternative Finder",
    "Reports": "Reports",
    "Compare Parts": "Compare Parts",
    "Datasheet Q&A": "Datasheet Q&A",
    "Sourcing Recommendation": "Procurement Advisor",
    "Design Impact Analyzer": "Design Impact Analyzer",
    "Cost Optimization": "Cost Optimization",
    "Supply Risk Scenario": "Supply Risk Scenario",
    "Settings": "Settings",
    "Portfolio Intelligence": "Portfolio Intelligence",
    "New BOM analysis": "BOM Analyzer",
  };

  function canonicalRouteForLabel(label) {
    const clean = String(label || "").replace(/\s+/g, " ").trim();
    if (!clean) return "";
    if (CANONICAL_ROUTE_BY_LABEL[clean]) return CANONICAL_ROUTE_BY_LABEL[clean];
    const lower = clean.toLowerCase();
    for (const [alias, route] of Object.entries(CANONICAL_ROUTE_BY_LABEL)) {
      if (alias.toLowerCase() === lower) return route;
    }
    return clean;
  }

  function displayNameForRoute(route) {
    const value = String(route || "").trim();
    if (!value) return "workspace";
    if (value === "Dashboard") return "Home";
    if (value === "Alternative Finder") return "Find a replacement";
    return value;
  }

  function ensureImmediateNavigationCover(w) {
    if (w.__cadivorImmediateNavigationCoverInstalled === IMMEDIATE_NAV_COVER_VERSION) {
      return;
    }
    const doc = w.document;
    if (!doc || !doc.addEventListener) return;

    // Tear down a prior install so file/deploy updates actually take effect.
    try {
      if (typeof w.__cadivorImmediateNavigationClick === "function") {
        doc.removeEventListener("click", w.__cadivorImmediateNavigationClick, true);
      }
      if (
        w.__cadivorImmediateNavigationObserver
        && typeof w.__cadivorImmediateNavigationObserver.disconnect === "function"
      ) {
        w.__cadivorImmediateNavigationObserver.disconnect();
      }
      // Stale toast/transparent cover CSS must be replaced — early-return on the
      // style id left Nov 3 5:48 recordings with a tiny Opening chip over a
      // blank remount instead of a full opaque workspace cover.
      const staleStyle = doc.getElementById("cadivor-instant-navigation-transition-style");
      if (staleStyle) staleStyle.remove();
      const staleShell = doc.getElementById("cadivor-shell-geometry-lock");
      if (staleShell) staleShell.remove();
    } catch (_) {}
    w.__cadivorImmediateNavigationCoverInstalled = IMMEDIATE_NAV_COVER_VERSION;

    const reportActionSelector = [
      '[class*="st-key-approved_home_menu_"]',
      '[class*="st-key-approved_home_action_review_"]',
      '[class*="st-key-approved_decision_action_risk_"]',
      '[class*="st-key-approved_decision_action_open_"]',
      '[class*="st-key-approved_decision_action_report_"]',
      '[class*="st-key-approved_home_view_all"]',
      '[class*="st-key-approved_bom_manage"]',
      '[class*="st-key-cadivor_bom_more_btn_"]',
    ].join(",");
    const state = {checkQueued: false};

    function syncShellGeometry() {
      const root = doc.documentElement;
      if (!root || !root.style) return;
      const signedOut = doc.querySelector('[data-cadivor-signed-out-surface="1"]');
      const signedOutStyle = signedOut ? w.getComputedStyle(signedOut) : null;
      if (
        signedOut
        && !signedOut.closest('[data-stale="true"]')
        && signedOutStyle.display !== "none"
        && signedOutStyle.visibility !== "hidden"
      ) {
        root.removeAttribute("data-cadivor-shell-locked");
        try { w.sessionStorage.removeItem("cadivor_shell_locked"); } catch (_) {}
        return;
      }
      const activeTopNavigation = Array.from(
        doc.querySelectorAll('[class*="st-key-cv_foundation_top_navigation"]')
      ).some((element) => {
        if (element.closest('[data-stale="true"]')) return false;
        const rect = element.getBoundingClientRect();
        return rect.width > 1 && rect.height > 1;
      });
      const rails = Array.from(
        doc.querySelectorAll('[class*="st-key-cv_foundation_navigation"]')
      );
      const activeRail = rails.find((element) => {
        if (element.closest('[data-stale="true"]')) return false;
        const rect = element.getBoundingClientRect();
        return rect.width > 1 && rect.height > 1;
      });
      if (activeTopNavigation && !activeRail) {
        root.removeAttribute("data-cadivor-shell-locked");
        try { w.sessionStorage.removeItem("cadivor_shell_locked"); } catch (_) {}
      } else if (activeRail) {
        // Authenticated rail geometry: lock stMain to the workspace column.
        root.setAttribute("data-cadivor-shell-locked", "1");
        try { w.sessionStorage.setItem("cadivor_shell_locked", "1"); } catch (_) {}
      } else {
        // Keep the workspace width stable while Streamlit remounts the rail
        // during a route change (URL handoff or click). Clearing the lock made
        // stMain jump from full viewport (~1363) to rail-offset (~1067).
        let persisted = false;
        try { persisted = w.sessionStorage.getItem("cadivor_shell_locked") === "1"; } catch (_) {}
        if (
          persisted
          || root.getAttribute("data-cadivor-shell-locked") === "1"
          || doc.getElementById("cadivor-instant-navigation-transition")
          || doc.querySelector('[data-cadivor-main-transition="1"]')
        ) {
          root.setAttribute("data-cadivor-shell-locked", "1");
        }
      }
    }

    function cleanLabel(button) {
      return String(button.innerText || button.textContent || "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function intentFor(button) {
      const label = cleanLabel(button);
      if (!label) return "";
      if (button.hasAttribute("aria-haspopup") || button.hasAttribute("aria-expanded")) {
        return "";
      }
      const sidebar = button.closest('[class*="st-key-cv_foundation_navigation"]');
      if (sidebar) {
        if (button.closest('[class*="st-key-cv_foundation_nav_active_"]')) return "";
        return label;
      }
      const savedBomTabs = button.closest('[class*="st-key-cv_analysis_section_nav"]');
      if (savedBomTabs) {
        if (/^More(?:\s|$)/i.test(label)) return "";
        return label;
      }
      const newAnalysis = button.closest(
        '[class*="st-key-approved_bom_new"], [class*="st-key-approved_home_new_bom"]'
      );
      if (newAnalysis || /^\+?\s*New BOM analysis$/i.test(label)) {
        return "New BOM analysis";
      }
      const savedBomAction = button.closest(reportActionSelector);
      if (savedBomAction) return label;
      if (/^(Watch this BOM|Datasheet Q&A|Compare parts|Design Impact)$/i.test(label)) {
        return label;
      }
      return "";
    }

    function bodyGeneration() {
      const markers = Array.from(doc.querySelectorAll("[data-cadivor-page-body-gen]"));
      if (!markers.length) return "";
      const marker = markers[markers.length - 1];
      return String(marker.getAttribute("data-cadivor-page-body-gen") || "").trim();
    }

    function hasReleasedDestination(previousGeneration = "") {
      const markers = Array.from(doc.querySelectorAll(
        "[data-cadivor-page-body-gen][data-cadivor-page-body-release-gen]"
      )).filter((marker) => !marker.closest('[data-stale="true"]'));
      for (let index = markers.length - 1; index >= 0; index -= 1) {
        const marker = markers[index];
        const generation = String(
          marker.getAttribute("data-cadivor-page-body-gen") || ""
        ).trim();
        const releasedGeneration = String(
          marker.getAttribute("data-cadivor-page-body-release-gen") || ""
        ).trim();
        if (
          generation
          && generation !== previousGeneration
          && releasedGeneration === generation
        ) return true;
      }
      return false;
    }

    function releasedForTransitionGen(transitionGen) {
      const gen = String(transitionGen || "").trim();
      if (!gen) return false;
      const marker = doc.querySelector(
        '[data-cadivor-page-body-gen="' + gen + '"][data-cadivor-page-body-release-gen="' + gen + '"]'
      );
      return !!(marker && !marker.closest('[data-stale="true"]'));
    }

    function liveDestination(selector) {
      return Array.from(doc.querySelectorAll(selector)).find(
        (element) => !element.closest('[data-stale="true"]')
      );
    }

    function mainScrollAtTop() {
      const candidates = [
        doc.querySelector("section[data-testid='stMain']"),
        doc.querySelector("[data-testid='stMainBlockContainer']"),
        doc.scrollingElement,
        doc.documentElement,
        doc.body,
      ].filter(Boolean);
      try { w.scrollTo({ top: 0, left: 0, behavior: "auto" }); } catch (_) {}
      let allTop = true;
      candidates.forEach((element) => {
        try {
          element.scrollTop = 0;
          if (typeof element.scrollTo === "function") {
            element.scrollTo({ top: 0, left: 0, behavior: "auto" });
          }
          const overflows = element.scrollHeight > element.clientHeight + 2;
          if (overflows && Math.abs(Number(element.scrollTop || 0)) > 2) {
            allTop = false;
          }
        } catch (_) {}
      });
      const windowTop = Number(
        w.scrollY || doc.documentElement.scrollTop || doc.body.scrollTop || 0
      );
      return allTop && windowTop <= 2;
    }

    function matchingDestinationReleased(cover) {
      const route = String(cover.getAttribute("data-cadivor-dest-route") || "").trim();
      const expectedGen = String(
        cover.getAttribute("data-cadivor-dest-gen") || ""
      ).trim();
      const markers = Array.from(doc.querySelectorAll("[data-cadivor-page-body-gen]"))
        .filter((marker) => !marker.closest('[data-stale="true"]'));
      for (let index = markers.length - 1; index >= 0; index -= 1) {
        const marker = markers[index];
        const bodyRoute = String(marker.getAttribute("data-cadivor-page-body") || "").trim();
        const gen = String(marker.getAttribute("data-cadivor-page-body-gen") || "").trim();
        const released = String(
          marker.getAttribute("data-cadivor-page-body-release-gen") || ""
        ).trim();
        if (!gen || released !== gen) continue;
        if (expectedGen && gen !== expectedGen) continue;
        if (route && bodyRoute && bodyRoute !== route) continue;
        // Prefer route match; allow gen-only when Python tracked dest-gen on cover.
        if (route && bodyRoute === route) return true;
        if (!route && expectedGen && gen === expectedGen) return true;
        if (!route && !expectedGen) return true;
      }
      return false;
    }

    function forceReleaseLatestMatching(cover) {
      const route = String(cover.getAttribute("data-cadivor-dest-route") || "").trim();
      const markers = Array.from(doc.querySelectorAll("[data-cadivor-page-body-gen]"))
        .filter((marker) => !marker.closest('[data-stale="true"]'));
      for (let index = markers.length - 1; index >= 0; index -= 1) {
        const marker = markers[index];
        const bodyRoute = String(marker.getAttribute("data-cadivor-page-body") || "").trim();
        const gen = String(marker.getAttribute("data-cadivor-page-body-gen") || "").trim();
        if (!gen) continue;
        if (route && bodyRoute && bodyRoute !== route) continue;
        if (marker.getAttribute("data-cadivor-page-body-release-gen") !== gen) {
          marker.setAttribute("data-cadivor-page-body-release-gen", gen);
        }
        return;
      }
    }

    function shouldRemoveInstantCover(cover, pythonCover) {
      const now = Date.now();
      const shownAt = Number(cover.getAttribute("data-cadivor-cover-shown-at") || "0");
      // Keep the skeleton visible while the destination is slow. Never tear it
      // down into a blank canvas early. Bound only as a last resort.
      if (shownAt && now - shownAt >= 8000) {
        forceReleaseLatestMatching(cover);
        mainScrollAtTop();
        return true;
      }

      const pythonGen = pythonCover
        ? String(pythonCover.getAttribute("data-cadivor-transition-gen") || "").trim()
        : "";
      if (pythonGen) {
        cover.setAttribute("data-cadivor-dest-gen", pythonGen);
        const pythonRoute = String(
          pythonCover.getAttribute("data-cadivor-route-loading") || ""
        ).trim();
        if (pythonRoute) {
          cover.setAttribute("data-cadivor-dest-route", pythonRoute);
          const label = cover.querySelector("[data-cadivor-instant-navigation-label]");
          if (label) label.textContent = "Opening " + displayNameForRoute(pythonRoute) + "…";
          cover.setAttribute("aria-label", "Opening " + displayNameForRoute(pythonRoute));
        }
      }

      if (!matchingDestinationReleased(cover) && !releasedForTransitionGen(pythonGen)) {
        return false;
      }
      // Destination shell is ready: require scroll at top, then release.
      return mainScrollAtTop();
    }

    function queueReleaseCheck() {
      if (state.checkQueued) return;
      state.checkQueued = true;
      const raf = typeof w.requestAnimationFrame === "function"
        ? w.requestAnimationFrame.bind(w)
        : (callback) => w.setTimeout(callback, 16);
      raf(() => {
        state.checkQueued = false;
        const cover = doc.getElementById("cadivor-instant-navigation-transition");
        if (!cover) return;

        // Browser owns the visible skeleton. Keep the Python cover mounted for
        // generation bookkeeping but do not blank it into an empty canvas —
        // hide only pointer events so it cannot steal clicks under the skeleton.
        const pythonCover = Array.from(doc.querySelectorAll(
          '[data-cadivor-main-transition="1"]'
        )).find((element) => !element.closest('[data-stale="true"]'));
        if (pythonCover) {
          pythonCover.style.setProperty("pointer-events", "none", "important");
        }

        if (shouldRemoveInstantCover(cover, pythonCover)) {
          raf(() => {
            const liveCover = doc.getElementById("cadivor-instant-navigation-transition");
            if (!liveCover) return;
            const livePython = Array.from(doc.querySelectorAll(
              '[data-cadivor-main-transition="1"]'
            )).find((element) => !element.closest('[data-stale="true"]'));
            if (!shouldRemoveInstantCover(liveCover, livePython)) return;
            liveCover.remove();
            const rail = doc.getElementById("cadivor-rail-continuity");
            if (rail) rail.remove();
          });
        }
      });
    }

    function installStyle() {
      if (!doc.getElementById("cadivor-shell-geometry-lock")) {
        const shell = doc.createElement("style");
        shell.id = "cadivor-shell-geometry-lock";
        shell.textContent = [
          "@media (min-width:701px){",
          "html[data-cadivor-shell-locked='1'] body section[data-testid='stMain']:not([data-stale='true']),body:has(#cadivor-instant-navigation-transition) section[data-testid='stMain']:not([data-stale='true']),body:has([data-cadivor-main-transition='1']) section[data-testid='stMain']:not([data-stale='true']){box-sizing:border-box!important;margin:0 0 0 var(--cv-foundation-rail,296px)!important;width:calc(100% - var(--cv-foundation-rail,296px))!important;max-width:none!important;min-width:0!important;padding-left:0!important;}",
          "html[data-cadivor-shell-locked='1'] body section[data-testid='stMain']:not([data-stale='true']) [data-testid='stMainBlockContainer'],html[data-cadivor-shell-locked='1'] body section[data-testid='stMain']:not([data-stale='true']) .main .block-container,body:has(#cadivor-instant-navigation-transition) section[data-testid='stMain']:not([data-stale='true']) [data-testid='stMainBlockContainer'],body:has([data-cadivor-main-transition='1']) section[data-testid='stMain']:not([data-stale='true']) [data-testid='stMainBlockContainer']{box-sizing:border-box!important;width:100%!important;min-width:0!important;max-width:none!important;margin-left:0!important;margin-right:0!important;}",
          "html[data-cadivor-shell-locked='1'] body [class*='st-key-cv_foundation_navigation']:not([data-stale='true']),body:has(#cadivor-instant-navigation-transition) [class*='st-key-cv_foundation_navigation']:not([data-stale='true']){box-sizing:border-box!important;position:fixed!important;left:0!important;top:0!important;bottom:0!important;width:var(--cv-foundation-rail,296px)!important;min-width:var(--cv-foundation-rail,296px)!important;max-width:var(--cv-foundation-rail,296px)!important;}",
          "html[data-cadivor-shell-locked='1'] body [class*='st-key-cv_foundation_navigation']:not([data-stale='true']) .stButton>button::before{box-sizing:border-box!important;flex:0 0 16px!important;width:16px!important;height:16px!important;max-width:16px!important;max-height:16px!important;background-size:16px 16px!important;}",
          "html[data-cadivor-shell-locked='1'] body [class*='st-key-cv_foundation_navigation']:not([data-stale='true']) .stButton>button svg{box-sizing:border-box!important;flex:0 0 16px!important;width:16px!important;height:16px!important;max-width:16px!important;max-height:16px!important;}",
          "}",
          "body:has(#cadivor-instant-navigation-transition) section[data-testid='stMain'] [data-stale='true']{pointer-events:none!important;}",
          "body:has(#cadivor-instant-navigation-transition) [class*='st-key-cv_foundation_navigation'] .stButton>button::before{box-sizing:border-box!important;flex:0 0 16px!important;width:16px!important;height:16px!important;max-width:16px!important;max-height:16px!important;background-size:16px 16px!important;}",
          "body:has(#cadivor-instant-navigation-transition) [class*='st-key-cv_foundation_navigation'] .stButton>button svg{box-sizing:border-box!important;flex:0 0 16px!important;width:16px!important;height:16px!important;max-width:16px!important;max-height:16px!important;}",
          "@media (max-width:700px){",
          "html body section[data-testid='stMain']{margin-left:0!important;width:100%!important;padding-left:0!important;}",
          "html body section[data-testid='stMain'] [data-testid='stMainBlockContainer'],html body section[data-testid='stMain'] .main .block-container{width:100%!important;max-width:none!important;margin-left:0!important;}",
          ".cv-ap-home-kpis{grid-template-columns:1fr!important;}",
          ".cv-ap-home-kpi .cv-ap-home-kpi-label,.cv-ap-home-kpi-copy strong{white-space:normal!important;}",
          ".cv-ap-home-kpi .cv-ap-home-icon{flex:0 0 48px!important;width:48px!important;height:48px!important;}",
          ".cv-ap-home-icon svg{width:24px!important;height:24px!important;}",
          "}",
        ].join("");
        (doc.head || doc.documentElement).appendChild(shell);
      }
      syncShellGeometry();
      let style = doc.getElementById("cadivor-instant-navigation-transition-style");
      if (style) style.remove();
      style = doc.createElement("style");
      style.id = "cadivor-instant-navigation-transition-style";
      style.setAttribute("data-cadivor-cover-style-version", IMMEDIATE_NAV_COVER_VERSION);
      style.textContent = [
        // Reserve rail width only — never paint an empty duplicate menu strip.
        '#cadivor-rail-continuity{display:none!important;}',
        '#cadivor-instant-navigation-transition{box-sizing:border-box!important;position:fixed!important;left:var(--cv-foundation-rail,296px)!important;right:0!important;top:var(--cv-foundation-top,64px)!important;bottom:0!important;width:auto!important;height:auto!important;z-index:2147483001!important;display:block!important;overflow:auto!important;margin:0!important;padding:clamp(20px,4vh,40px) clamp(18px,4vw,56px)!important;background:#F5F7FB!important;pointer-events:auto!important;font-family:Inter,system-ui,sans-serif!important}',
        '#cadivor-instant-navigation-transition .cv-instant-navigation-layout{box-sizing:border-box!important;width:100%!important;max-width:1440px!important;margin:0 auto!important}',
        '#cadivor-instant-navigation-transition .cv-instant-navigation-card{box-sizing:border-box!important;display:flex!important;align-items:center!important;gap:14px!important;width:100%!important;min-width:0!important;padding:14px 18px!important;border:1px solid #D6E3F5!important;border-radius:14px!important;background:#FFFFFF!important;box-shadow:0 4px 14px rgba(15,23,42,.04)!important;color:#334155!important;text-align:left!important}',
        '#cadivor-instant-navigation-transition .cv-instant-navigation-mark{box-sizing:border-box!important;display:grid!important;place-items:center!important;flex:0 0 36px!important;width:36px!important;height:36px!important;border-radius:10px!important;background:#2563EB!important;color:#FFFFFF!important;font-size:18px!important;font-weight:850!important}',
        '#cadivor-instant-navigation-transition .cv-instant-navigation-label{display:block!important;min-width:0!important;margin:0!important;color:#0F172A!important;font-size:15px!important;font-weight:800!important;line-height:1.25!important;letter-spacing:-.02em!important}',
        '#cadivor-instant-navigation-transition .cv-instant-navigation-progress{display:block!important;flex:0 0 76px!important;width:76px!important;height:4px!important;margin:0 0 0 auto!important;border-radius:999px!important;background:#E8EEF7!important;overflow:hidden!important}',
        '#cadivor-instant-navigation-transition .cv-instant-navigation-progress i{display:block!important;width:42%!important;height:100%!important;border-radius:999px!important;background:#2563EB!important;animation:cv-instant-navigation-progress 1.1s ease-in-out infinite!important}',
        '#cadivor-instant-navigation-transition .cv-instant-navigation-skeleton{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:16px!important;margin-top:18px!important}',
        '#cadivor-instant-navigation-transition .cv-instant-navigation-skeleton i{display:block!important;box-sizing:border-box!important;border:1px solid #E3EAF4!important;border-radius:14px!important;background:#FFFFFF!important}',
        '#cadivor-instant-navigation-transition .cv-instant-navigation-skeleton .cv-transition-hero{grid-column:1/-1!important;height:132px!important}',
        '#cadivor-instant-navigation-transition .cv-instant-navigation-skeleton .cv-transition-kpi{height:112px!important}',
        '#cadivor-instant-navigation-transition .cv-instant-navigation-skeleton .cv-transition-table{grid-column:1/-1!important;height:240px!important}',
        '#cadivor-instant-navigation-transition .cv-instant-navigation-skeleton i::after{content:""!important;display:block!important;height:8px!important;width:42%!important;margin:24px!important;border-radius:999px!important;background:#EEF2F8!important}',
        '@keyframes cv-instant-navigation-progress{0%{transform:translateX(-130%)}100%{transform:translateX(280%)}}',
        '@media(max-width:900px){#cadivor-instant-navigation-transition .cv-instant-navigation-skeleton{grid-template-columns:repeat(2,minmax(0,1fr))!important}}',
        '@media(max-width:700px){#cadivor-instant-navigation-transition{left:0!important;right:0!important;width:auto!important;}}',
      ].join("\n");
      (doc.head || doc.documentElement).appendChild(style);
    }

    function showImmediateCover(label) {
      installStyle();
      // Drop any leftover empty continuity strip from older cover versions.
      const staleRail = doc.getElementById("cadivor-rail-continuity");
      if (staleRail) staleRail.remove();
      const route = canonicalRouteForLabel(label);
      const display = displayNameForRoute(route || label);
      let cover = doc.getElementById("cadivor-instant-navigation-transition");
      if (!cover) {
        cover = doc.createElement("div");
        cover.id = "cadivor-instant-navigation-transition";
        cover.setAttribute("role", "status");
        cover.setAttribute("aria-live", "polite");
        cover.setAttribute("data-cadivor-instant-navigation-transition", "1");
        cover.innerHTML = [
          '<div class="cv-instant-navigation-layout">',
          '<div class="cv-instant-navigation-card">',
          '<span class="cv-instant-navigation-mark" aria-hidden="true">C</span>',
          '<strong class="cv-instant-navigation-label" data-cadivor-instant-navigation-label></strong>',
          '<span class="cv-instant-navigation-progress" aria-hidden="true"><i></i></span>',
          '</div>',
          '<div class="cv-instant-navigation-skeleton" aria-hidden="true">',
          '<i class="cv-transition-hero"></i><i class="cv-transition-kpi"></i><i class="cv-transition-kpi"></i>',
          '<i class="cv-transition-kpi"></i><i class="cv-transition-kpi"></i><i class="cv-transition-table"></i>',
          '</div></div>',
        ].join("");
        doc.body.appendChild(cover);
      }
      // Second click before prior transition finishes: retarget destination.
      cover.setAttribute("data-cadivor-prior-body-gen", bodyGeneration());
      cover.setAttribute("data-cadivor-cover-shown-at", String(Date.now()));
      cover.setAttribute("data-cadivor-dest-route", route || display);
      cover.removeAttribute("data-cadivor-dest-gen");
      cover.removeAttribute("data-cadivor-released-at");
      const text = cover.querySelector("[data-cadivor-instant-navigation-label]");
      const opening = /^\+?\s*New BOM analysis$/i.test(label)
        ? "Preparing a new BOM analysis…"
        : "Opening " + display + "…";
      if (text) text.textContent = opening;
      cover.setAttribute("aria-label", opening.replace(/…$/, ""));
      queueReleaseCheck();
    }

    function handleTransitionClick(event) {
      const rawTarget = event.target;
      const target = rawTarget && rawTarget.nodeType === 1
        ? rawTarget
        : rawTarget && rawTarget.parentElement;
      const button = target && target.closest ? target.closest("button") : null;
      if (!button || button.disabled) return;
      const label = intentFor(button);
      if (!label) return;
      showImmediateCover(label);
    }

    // Do not mount the cover on pointerdown. A full-workspace cover with
    // pointer-events:auto would sit under the later click and steal it from
    // Streamlit (New BOM stayed on Dashboard forever with "Preparing…").
    // Capture-phase click still paints the cover before paint, but the same
    // click event keeps the original button target so navigation runs.
    w.__cadivorImmediateNavigationClick = handleTransitionClick;
    w.__cadivorQueueNavigationCoverRelease = queueReleaseCheck;
    doc.addEventListener("click", handleTransitionClick, true);
    if (typeof w.MutationObserver === "function") {
      const observer = new w.MutationObserver(() => {
        syncShellGeometry();
        const pythonCover = Array.from(doc.querySelectorAll(
          '[data-cadivor-main-transition="1"]'
        )).find((element) => !element.closest('[data-stale="true"]'));
        if (pythonCover) {
          const historyCover = doc.getElementById("cadivor-history-transition");
          if (historyCover) historyCover.remove();
        }
        queueReleaseCheck();
      });
      observer.observe(doc.documentElement, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: [
          "class",
          "data-stale",
          "data-cadivor-page-body-gen",
          "data-cadivor-page-body-release-gen",
        ],
      });
      w.__cadivorImmediateNavigationObserver = observer;
    }
    installStyle();
    syncShellGeometry();
  }

  function ensureParentBridge() {
    const w = host();
    ensureImmediateNavigationCover(w);
    // Disable native history scroll restoration before the first Back/Forward.
    try { w.history.scrollRestoration = "manual"; } catch (_) {}
    if (w.__cadivorNavBridgeV4) return w.__cadivorNavBridgeV4;
    const state = {
      pending: null,
      lastHref: "",
      seq: 0,
      recoverySeq: 0,
      routeReleaseGen: "",
      routeReleaseStableChecks: 0,
    };
    try {
      state.lastHref = w.location.href || "";
    } catch (_) {
      state.lastHref = "";
    }
    const queue = (reason) => {
      let href = "";
      try {
        href = w.location.href || "";
      } catch (_) {
        return;
      }
      if (!href) return;
      // Always queue on popstate/hashchange even if href matched lastHref —
      // Streamlit may have remounted before a prior emit was delivered.
      if (reason === "url-change" && href === state.lastHref && state.pending) {
        return;
      }
      if (reason === "url-change" && href === state.lastHref) {
        return;
      }
      state.lastHref = href;
      state.seq += 1;
      state.pending = {
        href,
        reason,
        event_id: `${Date.now()}-${state.seq}-${Math.random().toString(36).slice(2, 8)}`,
      };
      if (reason === "popstate") {
        showHistoryTransition(href);
        scheduleRouteRecovery(href);
      }
    };

    function routeStateFromHref(href) {
      try {
        const url = new URL(href, w.location.href);
        const entries = Array.from(url.searchParams.entries())
          .filter(([key, value]) =>
            !["auth", "source", "cadivor_signed_out"].includes(key)
            && String(value || "").trim() !== ""
          );
        if (!entries.some(([key]) => key === "page")) entries.push(["page", "Dashboard"]);
        entries.sort((left, right) => {
          const keyOrder = left[0].localeCompare(right[0]);
          return keyOrder || left[1].localeCompare(right[1]);
        });
        return JSON.stringify(entries);
      } catch (_) {
        return "";
      }
    }

    function resetMainScrollToTop() {
      const doc = w.document;
      const main = doc.querySelector('[data-testid="stMain"]');
      const candidates = new Set([
        main,
        main && main.querySelector('[data-testid="stMainBlockContainer"]'),
        doc.querySelector('[data-testid="stMainBlockContainer"]'),
        doc.querySelector('section.main'),
        doc.querySelector('[data-testid="stAppViewContainer"]'),
        doc.scrollingElement,
        doc.documentElement,
        doc.body,
      ].filter(Boolean));
      if (main) {
        Array.from(main.querySelectorAll("*")).forEach((element) => {
          try {
            const style = w.getComputedStyle(element);
            const overflowY = style && style.overflowY;
            if (
              ["auto", "scroll", "overlay"].includes(overflowY)
              && element.scrollHeight > element.clientHeight + 1
            ) {
              candidates.add(element);
            }
          } catch (_) {}
        });
      }
      candidates.forEach((element) => {
        try {
          element.scrollTop = 0;
          if (typeof element.scrollTo === "function") {
            element.scrollTo({top: 0, left: 0, behavior: "auto"});
          }
        } catch (_) {}
      });
      try { w.scrollTo({top: 0, left: 0, behavior: "auto"}); } catch (_) {}
      const windowTop = Number(
        w.scrollY || doc.documentElement.scrollTop || doc.body.scrollTop || 0
      );
      return windowTop <= 1
        && Array.from(candidates).every((element) => {
          try {
            const overflows = element.scrollHeight > element.clientHeight + 1;
            return !overflows || Number(element.scrollTop || 0) <= 1;
          } catch (_) {
            return true;
          }
        });
    }
    function releaseNavigationCoverAfterScrollReset() {
      const doc = w.document;
      const coverSelector =
        '.cv-main-transition.cv-route-loading'
        + '[data-cadivor-transition-kind="navigation"]'
        + '[data-cadivor-transition-gen]';
      const covers = Array.from(doc.querySelectorAll(coverSelector));
      let destination = null;
      for (let index = covers.length - 1; index >= 0; index -= 1) {
        const cover = covers[index];
        const gen = String(cover.getAttribute("data-cadivor-transition-gen") || "").trim();
        if (!gen) continue;
        const body = doc.querySelector(
          '[data-cadivor-page-body-gen="' + gen + '"]'
        );
        if (body) {
          destination = {gen, body};
          break;
        }
      }

      if (!destination) {
        state.routeReleaseGen = "";
        state.routeReleaseStableChecks = 0;
        return;
      }

      const {gen, body} = destination;
      if (body.getAttribute("data-cadivor-page-body-release-gen") === gen) {
        state.routeReleaseGen = gen;
        state.routeReleaseStableChecks = 0;
        return;
      }
      if (state.routeReleaseGen !== gen) {
        state.routeReleaseGen = gen;
        state.routeReleaseStableChecks = 0;
      }

      const atTop = resetMainScrollToTop();
      state.routeReleaseStableChecks = atTop
        ? state.routeReleaseStableChecks + 1
        : 0;
      if (state.routeReleaseStableChecks >= 3) {
        body.setAttribute("data-cadivor-page-body-release-gen", gen);
        state.routeReleaseStableChecks = 0;
      }
    }

    function showHistoryTransition(targetHref) {
      const doc = w.document;
      let page = "workspace";
      try {
        page = new URL(targetHref, w.location.href).searchParams.get("page") || "Dashboard";
      } catch (_) {}
      try { w.history.scrollRestoration = "manual"; } catch (_) {}
      resetMainScrollToTop();

      if (!doc.getElementById("cadivor-history-transition-style")) {
        const style = doc.createElement("style");
        style.id = "cadivor-history-transition-style";
        style.textContent = `
          #cadivor-history-transition {
            box-sizing: border-box !important;
            position: fixed !important;
            left: var(--cv-foundation-rail, 296px) !important;
            right: 0 !important;
            top: var(--cv-foundation-top, 64px) !important;
            bottom: 0 !important;
            z-index: 2147483001 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: calc(100vw - var(--cv-foundation-rail, 296px)) !important;
            height: calc(100vh - var(--cv-foundation-top, 64px)) !important;
            height: calc(100dvh - var(--cv-foundation-top, 64px)) !important;
            min-height: 0 !important;
            overflow: hidden !important;
            background: #F5F7FB !important;
            pointer-events: auto !important;
            font-family: Inter, system-ui, sans-serif !important;
          }
          body:has(#cadivor-history-transition) section[data-testid="stMain"] {
            pointer-events: none !important;
          }
          #cadivor-history-transition .cv-history-transition-card {
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 190px;
            padding: 14px 18px;
            border: 1px solid #E4EAF3;
            border-radius: 14px;
            background: #FFFFFF;
            box-shadow: 0 8px 24px rgba(15, 23, 42, .06);
            color: #334155;
            font-size: 13px;
            font-weight: 650;
          }
          #cadivor-history-transition .cv-history-transition-mark {
            box-sizing: border-box;
            display: grid;
            place-items: center;
            flex: 0 0 32px;
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: #2563EB;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 850;
          }
          @media (max-width: 720px) {
            #cadivor-history-transition { left: 0 !important; right: 0 !important; width: 100vw !important; }
          }
        `;
        (doc.head || doc.documentElement).appendChild(style);
      }

      let overlay = doc.getElementById("cadivor-history-transition");
      if (!overlay) {
        overlay = doc.createElement("div");
        overlay.id = "cadivor-history-transition";
        overlay.setAttribute("data-cadivor-history-transition", "1");
        overlay.setAttribute("role", "status");
        overlay.setAttribute("aria-live", "polite");
        overlay.innerHTML = '<div class="cv-history-transition-card"><span class="cv-history-transition-mark" aria-hidden="true">C</span><span data-cadivor-history-transition-label></span></div>';
        doc.body.appendChild(overlay);
      }
      const label = overlay.querySelector("[data-cadivor-history-transition-label]");
      if (label) label.textContent = `Opening ${page}…`;
      overlay.setAttribute("aria-label", `Opening ${page}`);
    }

    function finishHistoryTransition() {
      const overlay = w.document.getElementById("cadivor-history-transition");
      if (overlay) overlay.remove();
    }

    function scheduleRouteRecovery(targetHref) {
      const token = ++state.recoverySeq;
      const targetState = routeStateFromHref(targetHref);
      if (!targetState) return;
      const startedAt = Date.now();
      let stableTopChecks = 0;
      const verify = () => {
        if (token !== state.recoverySeq) return;
        let currentHref = "";
        try { currentHref = w.location.href || ""; } catch (_) {}
        if (currentHref !== targetHref) return;

        const marker = w.document.querySelector(
          '[data-cadivor-route-root="1"][data-cadivor-route-state]'
        );
        const renderedState = marker && marker.getAttribute("data-cadivor-route-state");
        const elapsed = Date.now() - startedAt;
        if (renderedState === targetState) {
          stableTopChecks = resetMainScrollToTop() ? stableTopChecks + 1 : 0;
          if (stableTopChecks >= 2 && elapsed >= 100) {
            finishHistoryTransition();
            return;
          }
          w.setTimeout(verify, 50);
          return;
        }
        stableTopChecks = 0;

        if (!marker) {
          if (elapsed >= 6000) {
            try { w.location.reload(); } catch (_) {}
            return;
          }
          w.setTimeout(verify, 50);
          return;
        }
        const targetPage = new URL(targetHref, w.location.href).searchParams.get("page") || "Dashboard";
        const loading = w.document.querySelector("[data-cadivor-route-loading]");
        const loadingPage = loading && loading.getAttribute("data-cadivor-route-loading");
        const waitLimit = loadingPage === targetPage ? 8000 : 1800;
        if (elapsed >= waitLimit) {
          try { w.location.reload(); } catch (_) {}
          return;
        }
        w.setTimeout(verify, 50);
      };
      w.setTimeout(verify, 0);
    }
    try {
      w.addEventListener("popstate", () => queue("popstate"));
      w.addEventListener("pageshow", (event) => {
        if (!event || !event.persisted) return;
        let href = "";
        try { href = w.location.href || ""; } catch (_) {}
        if (!href) return;
        showHistoryTransition(href);
        scheduleRouteRecovery(href);
      });
      w.addEventListener("hashchange", () => queue("hashchange"));
    } catch (_) {}
    // Fallback when popstate is swallowed; Python ignores in-app push echoes.
    w.setInterval(() => {
      queue("url-change");
      releaseNavigationCoverAfterScrollReset();
    }, 300);
    // Keep probing title settle while the opaque cover is mounted so we do
    // not depend solely on MutationObserver bursts after release-gen.
    w.setInterval(() => {
      if (
        w.document.getElementById("cadivor-instant-navigation-transition")
        && typeof w.__cadivorQueueNavigationCoverRelease === "function"
      ) {
        try { w.__cadivorQueueNavigationCoverRelease(); } catch (_) {}
      }
    }, 50);
    w.__cadivorNavBridgeV4 = state;
    return state;
  }

  function emitPending() {
    if (!ready) return;
    const state = ensureParentBridge();
    const pending = state.pending;
    if (!pending || !pending.event_id) return;
    if (pending.event_id === lastEmittedId) return;
    lastEmittedId = pending.event_id;
    state.pending = null;
    post("streamlit:setComponentValue", {
      value: pending,
      dataType: "json",
    });
  }

  window.addEventListener("message", (event) => {
    const data = event.data || {};
    if (data.type !== "streamlit:render") return;
    ready = true;
    ensureParentBridge();
    emitPending();
  });

  // Drain promptly while this iframe lives.
  window.setInterval(emitPending, 200);

  post("streamlit:componentReady", {apiVersion: 1});
  // A zero-height component can be hidden by Streamlit's element wrapper,
  // which prevents the parent window's Back/Forward listener from mounting.
  // Keep a 1px frame alive; auth_gate.py clips the wrapper off-screen.
  post("streamlit:setFrameHeight", {height: 1});
})();
</script>
</body>
</html>
