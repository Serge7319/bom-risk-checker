<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>html,body{margin:0;padding:0;width:1px;height:1px;overflow:hidden}</style>
</head>
<body>
<script>
(() => {
  /**
   * Cadivor browser Back/Forward bridge.
   *
   * Streamlit's built-in popstate handler only reacts to multipage pathname
   * changes — query-only history hops never rerun the script. This component
   * emits one setComponentValue when the address bar changes so Python can
   * restore the route without writing query params again.
   *
   * The listener is installed on the parent window and survives iframe remounts.
   * The iframe only drains a pending event into Streamlit.
   */
  let ready = false;
  let lastEmittedId = "";

  function post(type, extra = {}) {
    window.parent.postMessage({isStreamlitMessage: true, type, ...extra}, "*");
  }

  function host() {
    return window.parent;
  }

  function ensureParentBridge() {
    const w = host();
    // Disable native history scroll restoration before the first Back/Forward.
    try { w.history.scrollRestoration = "manual"; } catch (_) {}
    if (w.__cadivorNavBridgeV4) return w.__cadivorNavBridgeV4;
    const state = {
      pending: null,
      lastHref: "",
      seq: 0,
      recoverySeq: 0,
    };
    try {
      state.lastHref = w.location.href || "";
    } catch (_) {
      state.lastHref = "";
    }
    const queue = (reason) => {
      let href = "";
      try {
        href = w.location.href || "";
      } catch (_) {
        return;
      }
      if (!href) return;
      // Always queue on popstate/hashchange even if href matched lastHref —
      // Streamlit may have remounted before a prior emit was delivered.
      if (reason === "url-change" && href === state.lastHref && state.pending) {
        return;
      }
      if (reason === "url-change" && href === state.lastHref) {
        return;
      }
      state.lastHref = href;
      state.seq += 1;
      state.pending = {
        href,
        reason,
        event_id: `${Date.now()}-${state.seq}-${Math.random().toString(36).slice(2, 8)}`,
      };
      if (reason === "popstate") {
        showHistoryTransition(href);
        scheduleRouteRecovery(href);
      }
    };

    function routeStateFromHref(href) {
      try {
        const url = new URL(href, w.location.href);
        const entries = Array.from(url.searchParams.entries())
          .filter(([key, value]) =>
            !["auth", "source", "cadivor_signed_out"].includes(key)
            && String(value || "").trim() !== ""
          );
        if (!entries.some(([key]) => key === "page")) entries.push(["page", "Dashboard"]);
        entries.sort((left, right) => {
          const keyOrder = left[0].localeCompare(right[0]);
          return keyOrder || left[1].localeCompare(right[1]);
        });
        return JSON.stringify(entries);
      } catch (_) {
        return "";
      }
    }

    function resetMainScrollToTop() {
      const doc = w.document;
      const main = doc.querySelector('[data-testid="stMain"]');
      const candidates = new Set([
        main,
        doc.scrollingElement,
        doc.documentElement,
        doc.body,
      ].filter(Boolean));
      if (main) {
        Array.from(main.querySelectorAll("*")).forEach((element) => {
          try {
            const style = w.getComputedStyle(element);
            const overflowY = style && style.overflowY;
            if (
              ["auto", "scroll", "overlay"].includes(overflowY)
              && element.scrollHeight > element.clientHeight + 1
            ) {
              candidates.add(element);
            }
          } catch (_) {}
        });
      }
      candidates.forEach((element) => {
        try {
          element.scrollTop = 0;
          if (typeof element.scrollTo === "function") {
            element.scrollTo({top: 0, left: 0, behavior: "auto"});
          }
        } catch (_) {}
      });
      try { w.scrollTo({top: 0, left: 0, behavior: "auto"}); } catch (_) {}
      const windowTop = Number(
        w.scrollY || doc.documentElement.scrollTop || doc.body.scrollTop || 0
      );
      return windowTop <= 1
        && Array.from(candidates).every((element) => Number(element.scrollTop || 0) <= 1);
    }
    function showHistoryTransition(targetHref) {
      const doc = w.document;
      let page = "workspace";
      try {
        page = new URL(targetHref, w.location.href).searchParams.get("page") || "Dashboard";
      } catch (_) {}
      try { w.history.scrollRestoration = "manual"; } catch (_) {}
      resetMainScrollToTop();

      if (!doc.getElementById("cadivor-history-transition-style")) {
        const style = doc.createElement("style");
        style.id = "cadivor-history-transition-style";
        style.textContent = `
          #cadivor-history-transition {
            box-sizing: border-box !important;
            position: fixed !important;
            left: var(--cv-foundation-rail, 228px) !important;
            right: 0 !important;
            top: var(--cv-foundation-top, 64px) !important;
            bottom: 0 !important;
            z-index: 2147483001 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            overflow: hidden !important;
            background: #F5F7FB !important;
            pointer-events: auto !important;
            font-family: Inter, system-ui, sans-serif !important;
          }
          #cadivor-history-transition .cv-history-transition-card {
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 190px;
            padding: 14px 18px;
            border: 1px solid #E4EAF3;
            border-radius: 14px;
            background: #FFFFFF;
            box-shadow: 0 8px 24px rgba(15, 23, 42, .06);
            color: #334155;
            font-size: 13px;
            font-weight: 650;
          }
          #cadivor-history-transition .cv-history-transition-mark {
            box-sizing: border-box;
            display: grid;
            place-items: center;
            flex: 0 0 32px;
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: #2563EB;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 850;
          }
          @media (max-width: 720px) {
            #cadivor-history-transition { left: 0 !important; }
          }
        `;
        (doc.head || doc.documentElement).appendChild(style);
      }

      let overlay = doc.getElementById("cadivor-history-transition");
      if (!overlay) {
        overlay = doc.createElement("div");
        overlay.id = "cadivor-history-transition";
        overlay.setAttribute("data-cadivor-history-transition", "1");
        overlay.setAttribute("role", "status");
        overlay.setAttribute("aria-live", "polite");
        overlay.innerHTML = '<div class="cv-history-transition-card"><span class="cv-history-transition-mark" aria-hidden="true">C</span><span data-cadivor-history-transition-label></span></div>';
        doc.body.appendChild(overlay);
      }
      const label = overlay.querySelector("[data-cadivor-history-transition-label]");
      if (label) label.textContent = `Opening ${page}…`;
      overlay.setAttribute("aria-label", `Opening ${page}`);
    }

    function finishHistoryTransition() {
      const overlay = w.document.getElementById("cadivor-history-transition");
      if (overlay) overlay.remove();
    }

    function scheduleRouteRecovery(targetHref) {
      const token = ++state.recoverySeq;
      const targetState = routeStateFromHref(targetHref);
      if (!targetState) return;
      const startedAt = Date.now();
      let stableTopChecks = 0;
      const verify = () => {
        if (token !== state.recoverySeq) return;
        let currentHref = "";
        try { currentHref = w.location.href || ""; } catch (_) {}
        if (currentHref !== targetHref) return;

        const marker = w.document.querySelector(
          '[data-cadivor-route-root="1"][data-cadivor-route-state]'
        );
        const renderedState = marker && marker.getAttribute("data-cadivor-route-state");
        const elapsed = Date.now() - startedAt;
        if (renderedState === targetState) {
          stableTopChecks = resetMainScrollToTop() ? stableTopChecks + 1 : 0;
          if (stableTopChecks >= 2 && elapsed >= 100) {
            finishHistoryTransition();
            return;
          }
          w.setTimeout(verify, 50);
          return;
        }
        stableTopChecks = 0;

        if (!marker) {
          if (elapsed >= 6000) {
            try { w.location.reload(); } catch (_) {}
            return;
          }
          w.setTimeout(verify, 50);
          return;
        }
        const targetPage = new URL(targetHref, w.location.href).searchParams.get("page") || "Dashboard";
        const loading = w.document.querySelector("[data-cadivor-route-loading]");
        const loadingPage = loading && loading.getAttribute("data-cadivor-route-loading");
        const waitLimit = loadingPage === targetPage ? 8000 : 1800;
        if (elapsed >= waitLimit) {
          try { w.location.reload(); } catch (_) {}
          return;
        }
        w.setTimeout(verify, 50);
      };
      w.setTimeout(verify, 0);
    }
    try {
      w.addEventListener("popstate", () => queue("popstate"));
      w.addEventListener("pageshow", (event) => {
        if (!event || !event.persisted) return;
        let href = "";
        try { href = w.location.href || ""; } catch (_) {}
        if (!href) return;
        showHistoryTransition(href);
        scheduleRouteRecovery(href);
      });
      w.addEventListener("hashchange", () => queue("hashchange"));
    } catch (_) {}
    // Fallback when popstate is swallowed; Python ignores in-app push echoes.
    w.setInterval(() => queue("url-change"), 300);
    w.__cadivorNavBridgeV4 = state;
    return state;
  }

  function emitPending() {
    if (!ready) return;
    const state = ensureParentBridge();
    const pending = state.pending;
    if (!pending || !pending.event_id) return;
    if (pending.event_id === lastEmittedId) return;
    lastEmittedId = pending.event_id;
    state.pending = null;
    post("streamlit:setComponentValue", {
      value: pending,
      dataType: "json",
    });
  }

  window.addEventListener("message", (event) => {
    const data = event.data || {};
    if (data.type !== "streamlit:render") return;
    ready = true;
    ensureParentBridge();
    emitPending();
  });

  // Drain promptly while this iframe lives.
  window.setInterval(emitPending, 200);

  post("streamlit:componentReady", {apiVersion: 1});
  // A zero-height component can be hidden by Streamlit's element wrapper,
  // which prevents the parent window's Back/Forward listener from mounting.
  // Keep a 1px frame alive; auth_gate.py clips the wrapper off-screen.
  post("streamlit:setFrameHeight", {height: 1});
})();
</script>
</body>
</html>
