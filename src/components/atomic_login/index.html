<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:transparent}
    form{display:grid;gap:14px;padding:1px}
    label{display:grid;gap:7px;font-size:14px;font-weight:700;color:#334155}
    input{width:100%;height:44px;border:1px solid #cbd5e1;border-radius:9px;padding:0 13px;background:#fff;color:#0f172a;font:500 15px/1.2 inherit;outline:none;box-shadow:0 1px 2px rgba(15,23,42,.03)}
    input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.13)}
    input:disabled{background:#f8fafc;color:#64748b;cursor:wait}
    input::placeholder{color:#94a3b8}
    button{height:44px;border:0;border-radius:9px;background:#2563eb;color:#fff;font:700 15px/1 inherit;cursor:pointer;box-shadow:0 7px 16px rgba(37,99,235,.2)}
    button:hover{background:#1d4ed8}
    button:focus-visible{outline:3px solid rgba(37,99,235,.25);outline-offset:2px}
    button:disabled{cursor:wait;opacity:.72}
    .status{min-height:18px;margin:0;color:#b91c1c;font-size:13px;font-weight:650;line-height:1.35}
    .status:not(:empty){margin-top:2px}
  </style>
</head>
<body>
  <form id="login" autocomplete="on" novalidate>
    <label>Email
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@company.com" required>
    </label>
    <label>Password
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
    </label>
    <p id="status" class="status" role="alert" aria-live="polite" data-login-error></p>
    <button id="submit" type="submit">Login</button>
  </form>
<script>
(() => {
  const form = document.getElementById("login");
  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const button = document.getElementById("submit");
  const status = document.getElementById("status");
  let submitted = false;
  let streamlitRenderReady = false;
  let pendingSubmitValue = null;
  let idleSubmitLabel = "Login";
  let lastPrefillEmail = "";
  let lastErrorEpoch = -1;

  function post(type, extra = {}) {
    window.parent.postMessage({isStreamlitMessage:true,type,...extra},"*");
  }
  function resize() {
    post("streamlit:setFrameHeight",{height:Math.ceil(document.documentElement.scrollHeight)});
  }
  function requestId() {
    if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
    return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2);
  }
  function setBusy(isBusy, label) {
    email.disabled = Boolean(isBusy);
    password.disabled = Boolean(isBusy);
    button.disabled = Boolean(isBusy) || submitted;
    if (isBusy) {
      button.textContent = "Signing in…";
    } else if (!submitted) {
      button.textContent = label || idleSubmitLabel;
    }
  }
  function applyServerError(message) {
    submitted = false;
    status.textContent = message;
    password.value = "";
    setBusy(false, idleSubmitLabel);
    // Focus password after enable so the user can retry immediately.
    window.setTimeout(() => {
      try { password.focus(); } catch (_) {}
    }, 0);
    resize();
  }
  function sendPendingSubmitWhenReady() {
    // The card is intentionally visible while Streamlit initializes this
    // iframe. A physical submit during that small window must survive until
    // the component has received its first render handshake.
    if (!streamlitRenderReady || !pendingSubmitValue) return;
    post("streamlit:setComponentValue",{
      value:pendingSubmitValue,
      dataType:"json"
    });
    pendingSubmitValue = null;
  }

  window.addEventListener("message", (event) => {
    const data = event.data || {};
    if (data.type !== "streamlit:render") return;
    const args = data.args || {};
    streamlitRenderReady = true;
    if (typeof args.submit_label === "string" && args.submit_label.trim()) {
      idleSubmitLabel = args.submit_label.trim();
    }
    const prefill = typeof args.prefill_email === "string" ? args.prefill_email.trim() : "";
    if (prefill && prefill !== lastPrefillEmail) {
      email.value = prefill;
      lastPrefillEmail = prefill;
    }
    const serverError = typeof args.error_message === "string" ? args.error_message.trim() : "";
    let errorEpoch = 0;
    try { errorEpoch = Number(args.error_epoch || 0) || 0; } catch (_) { errorEpoch = 0; }
    if (serverError && errorEpoch !== lastErrorEpoch) {
      lastErrorEpoch = errorEpoch;
      applyServerError(serverError);
    } else if (serverError) {
      // Same epoch re-render: keep the visible error and stay enabled.
      submitted = false;
      status.textContent = serverError;
      setBusy(Boolean(args.disabled), idleSubmitLabel);
    } else if (!submitted) {
      status.textContent = "";
      setBusy(Boolean(args.disabled), idleSubmitLabel);
    } else {
      setBusy(Boolean(args.disabled), idleSubmitLabel);
    }
    sendPendingSubmitWhenReady();
    resize();
  });

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    if (submitted || button.disabled) return;
    const emailValue = email.value.trim();
    const passwordValue = password.value;
    if (!emailValue || !passwordValue) {
      status.textContent = "Please enter your email and password.";
      resize();
      return;
    }
    submitted = true;
    setBusy(true);
    status.textContent = "";
    pendingSubmitValue = {
      email:emailValue,
      password:passwordValue,
      request_id:requestId()
    };
    sendPendingSubmitWhenReady();
    resize();
  });

  post("streamlit:componentReady",{apiVersion:1});
  resize();
})();
</script>
</body>
</html>
